plugins { id 'com.android.application' }
android {
    namespace 'net.amirul.tvhome'
    compileSdk 33
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'net.amirul.tvhome'
        minSdk 28          // TV runs Android 9
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // A debug build puts android:debuggable="true" in the manifest, and on Android TV a debuggable HOME app
    // can be read and written from any ADB shell via `run-as` (see docs/SECURITY.md). Ship the release variant.
    signingConfigs {
        release {
            // Keep this file out of git: state/ is git-ignored. If it does not exist yet, create it:
            //   keytool -genkeypair -keystore state/tvhome.keystore -alias tvhome \
            //     -keyalg RSA -keysize 2048 -validity 10000 -storepass <pw> -keypass <pw> \
            //     -dname "CN=TvHome, O=Local, C=MY"
            // then put the passwords in state/keystore.properties:
            //   storeFile=../state/tvhome.keystore
            //   storePassword=...
            //   keyAlias=tvhome
            //   keyPassword=...
            def props = new Properties()
            def f = rootProject.file('state/keystore.properties')
            if (f.exists()) props.load(new FileInputStream(f))
            storeFile     props['storeFile']     ? rootProject.file(props['storeFile']) : null
            storePassword props['storePassword']
            keyAlias      props['keyAlias']
            keyPassword   props['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // never used by scripts/04-install-launcher.sh --build
            applicationIdSuffix ''
        }
    }
}
dependencies { implementation 'androidx.recyclerview:recyclerview:1.3.1' }
